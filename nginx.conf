
#user  nobody;
worker_processes  1;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       mime.types;
    default_type  application/octet-stream;

    #log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
    #                  '$status $body_bytes_sent "$http_referer" '
    #                  '"$http_user_agent" "$http_x_forwarded_for"';

    #access_log  logs/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    #keepalive_timeout  0;
    keepalive_timeout  65;

    #gzip  on;

    # ------------------------------------------------------------------
    # Upstream application servers (both on the same machine, different ports).
    #   backend  : FastAPI / uvicorn       10.240.87.68:8516
    #   frontend : Vite SPA (TanStack)     10.240.87.68:8518
    # ------------------------------------------------------------------
    upstream backend {
        server 10.240.87.68:8516;
    }

    upstream frontend {
        server 10.240.87.68:8518;
    }

    server {
        # The load balancer (https://digitaoffice-dev.rbl.bank.in)
        # terminates TLS and forwards to nginx here on 8444.
        listen       0.0.0.0:8444;
        server_name  0.0.0.0;

        #access_log  logs/host.access.log  main;

        # ------------------------------------------------------------------
        # 1. API calls from the SPA → Backend
        #
        # The SPA prefixes all its API calls with "/api".
        # The trailing slash on proxy_pass strips the "/api" prefix:
        #   /api/auth/login   → /auth/login
        #   /api/agents/email → /agents/email
        # ------------------------------------------------------------------
        location /api/ {
            proxy_pass         http://backend/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ------------------------------------------------------------------
        # 2. Microsoft OAuth callback → Backend
        #
        # After Microsoft login, the browser is redirected to:
        #   https://digitaoffice-dev.rbl.bank.in/callback?code=abc123
        #
        # This MUST go to the backend's callback() handler which
        # exchanges the code for tokens, creates a session, and
        # sets the cookie.
        # ------------------------------------------------------------------
        location = /callback {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ------------------------------------------------------------------
        # 3. Direct backend routes (without /api prefix)
        # ------------------------------------------------------------------
        location = /health {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location /docs {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location /redoc {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location /openapi.json {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        location /auth/ {
            proxy_pass         http://backend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
        }

        # ------------------------------------------------------------------
        # 3b. Block raw source / config exposure (VAPT finding)
        #
        # In the deployed build these must NEVER be reachable:
        #   /vite.config.ts?raw  /package.json?raw  /wrangler.jsonc?raw
        #   /src/*?raw  /src/*?url  and any ?raw / ?url import-resolution.
        #
        # Vite's dev server resolves `?raw` / `?url` into the literal file
        # contents, and will happily hand back TypeScript sources, the
        # Cloudflare config, and package manifests. nginx fronts the
        # upstream, so deny these here regardless of what the upstream
        # (dev server or static build) would otherwise return. These blocks
        # sit BEFORE the catch-all `location /` so they win the match.
        #
        # This is purely a serve-config hardening: no application API route
        # is touched. The SPA itself is served as compiled/bundled assets by
        # `location /`; it never needs to fetch its own .ts/.jsonc sources or
        # a ?raw/?url of them at runtime, so denying these cannot break it.

        # Deny the specific config/manifest files anywhere in the path.
        location ~* /(vite\.config\.(ts|js)|wrangler\.jsonc|package(-lock)?\.json|bun\.lock|tsconfig[^/]*\.json)$ {
            return 404;
        }

        # Deny raw TypeScript/source files and anything under /src.
        location ~* \.(ts|tsx|jsx|mts|cts)$ {
            return 404;
        }
        location ^~ /src/ {
            return 404;
        }

        # Deny Vite's ?raw / ?url import-resolution regardless of the path.
        # `$args` is the raw query string; match a bare or valued raw/url arg.
        if ($args ~* "(^|&)(raw|url)(=|&|$)") {
            return 404;
        }

        # ------------------------------------------------------------------
        # 4. Everything (including /) → Frontend SPA
        #
        # The SPA handles auth checking itself:
        #   - SPA loads → calls /api/auth/me
        #   - If 401 (not logged in) → SPA redirects to /api/auth/login
        #   - If 200 (logged in) → SPA shows the dashboard
        #
        # This way the user sees a loading/blank screen until auth is
        # confirmed, NOT the full app before login.
        #
        # Upgrade headers support Vite's HMR websocket for dev.
        # ------------------------------------------------------------------
        location / {
            proxy_pass         http://frontend;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
        }

        #error_page  404              /404.html;

        # redirect server error pages to the static page /50x.html
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
}
