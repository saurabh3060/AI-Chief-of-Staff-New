; llama-server router presets (one entry per model). Start with startup.bat.
; Keys are llama-server flags without the leading dashes.
; CPU settings measured on a Core Ultra 7 265H with llama-bench:
;   12 threads: fastest generation (16 is slower: the low-power E-cores hold the others back)
;   ubatch 1024: ~30% faster prompt reading than the default 512
version = 1

[*]
threads = 12
threads-batch = 12
batch-size = 2048
ubatch-size = 1024
flash-attn = on
; One user, so one slot gets the whole context instead of splitting it.
parallel = 1

; Chat model in use (config.CHAT_MODEL): 3B dense with tool calling (IBM's official Q4_K_M GGUF).
; No cache-reuse: shifting chunks of the previous question's prompt into the new one is only
; approximate, and it made granite misread table cells (a neighbouring month's value) depending on
; which question came before. Plain prefix caching (exact) still reuses the shared system prompt.
[granite-4.2-3b]
model = models/granite-4.2-3b.gguf
ctx-size = 8192
jinja = true

; Reads charts once at ingestion; trained for chart-to-CSV extraction.
; Q8_0 because small models lose number accuracy at Q4.
[granite-vision-4.1-4b]
model = models/granite-vision-4.1-4b/granite-vision-4.1-4b-Q8_0.gguf
mmproj = models/granite-vision-4.1-4b/mmproj-model-f16.gguf
; A high-resolution page is split into several image tiles, each costing tokens.
ctx-size = 16384

; Reranker in use (config.RERANK_MODEL): jina-reranker-v2, ~290 MB. CPU only (n-gpu-layers 0)
; so gemma keeps the dev GPU's 8 GB. Passages are cut to 1200 chars in code, so 2048 fits a pair.
[jina-reranker-v2]
model = models/jina-reranker-v2.gguf
reranking = true
n-gpu-layers = 0
ctx-size = 2048
batch-size = 2048
ubatch-size = 2048

[nomic-embed-text]
model = models/nomic-embed-text.gguf
embedding = true
ctx-size = 2048
batch-size = 2048
ubatch-size = 2048
